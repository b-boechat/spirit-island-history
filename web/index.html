<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spirit Island — Run History</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // Apply the theme before the page paints, so there's no flash of the wrong one.
    // Choice is "auto" | "light" | "dark"; auto follows the system setting.
    (function () {
      var choice = localStorage.getItem("si-history.theme") || "auto";
      var dark = choice === "dark" || (choice === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Spirit Island <span>Run History</span></h1>
    <div class="device-bar">
      <span id="device-controls" class="device-controls">
        <label for="device-select">Device</label>
        <select id="device-select"></select>
        <button id="refresh" class="btn" type="button" title="Fetch the latest games from the online feed">Refresh</button>
      </span>
      <select id="theme" class="theme-select" aria-label="Color theme" title="Color theme">
        <option value="auto">Auto theme</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
  </header>

  <div id="notice" class="notice" role="status" hidden></div>

  <!-- First use: shown instead of the history while no device is set up -->
  <section id="welcome" class="welcome" hidden></section>

  <main id="main" class="layout">
    <aside id="filters" class="sidebar" aria-label="Filters" hidden></aside>
    <section class="content">
      <div class="list-head">
        <div class="list-title">
          <h2 id="count" class="count"></h2>
          <button id="filters-toggle" class="btn btn-small filters-toggle" type="button" aria-controls="filters" aria-expanded="false" hidden>Filters</button>
        </div>
        <p id="updated" class="muted small"></p>
      </div>
      <div class="view-tabs" role="tablist" aria-label="View">
        <button id="tab-history" class="view-tab" type="button" role="tab" aria-controls="games" aria-selected="true">History</button>
        <button id="tab-stats" class="view-tab" type="button" role="tab" aria-controls="stats" aria-selected="false">Statistics</button>
        <div class="export" id="export" hidden>
          <span class="muted small">Export shown games:</span>
          <button id="export-csv" class="btn btn-small" type="button" title="Download as a spreadsheet (CSV)">CSV</button>
          <button id="export-json" class="btn btn-small" type="button" title="Download the original game records (JSON)">JSON</button>
        </div>
      </div>
      <div id="art-banner" class="art-banner" hidden></div>
      <div id="chips" class="chips" hidden></div>
      <div id="games" class="games" role="tabpanel" aria-labelledby="tab-history"></div>
      <div id="stats" class="stats" role="tabpanel" aria-labelledby="tab-stats" hidden></div>
    </section>
  </main>

  <footer class="footer">
    <details id="art-status" hidden>
      <summary></summary>
      <div class="art-download">
        <button id="art-download" class="btn btn-small" type="button">Download missing artwork</button>
        <span id="art-download-status" class="muted small"></span>
      </div>
      <p class="muted small">The pictures come from mindwanderer.net/si. To add one yourself, save it into these folders with exactly these file names (.png, .jpg or .webp), then reload the page.</p>
      <ul id="art-missing" class="art-missing"></ul>
    </details>
  </footer>

  <dialog id="detail" class="detail" aria-labelledby="detail-title"></dialog>
  <dialog id="devices-dialog" class="devices-dialog" aria-labelledby="devices-title"></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
